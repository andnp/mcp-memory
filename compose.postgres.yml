services:
  postgres:
    image: postgres:17
    container_name: mcp-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MCP_MEMORY_POSTGRES_DB:-mcp_memory}
      POSTGRES_USER: ${MCP_MEMORY_POSTGRES_USER:-mcp_memory}
      POSTGRES_PASSWORD: ${MCP_MEMORY_POSTGRES_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${MCP_MEMORY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - mcp-memory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mcp-memory-postgres-data: