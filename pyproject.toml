[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for persistent, workspace-aware AI memory."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.34.0",
    "mcp>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.2.9",
    "psycopg-pool>=3.2.6",
    "sentence-transformers>=5.1.0",
    "tomlkit>=0.13.0",
    "pyzmq>=27.0.0",
    "textual>=0.44.0",
    "github-copilot-sdk>=1.0.1",
    "andnp-searchkernel[ollama]>=0.23.0",
]

[project.scripts]
mcp-memory = "mcp_memory.entrypoint:main"

[dependency-groups]
dev = [
    "docker>=7.1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.23",
]

[tool.uv]
package = true

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: fast, isolated tests with no network or model loading",
    "medium: in-process integration tests using real local components",
    "large: end-to-end tests that may start full processes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "I", "UP", "SIM", "RUF"]
ignore = [
    "SIM117",
    "UP035",
    "SIM105",
    "SIM118",
    "B023",
    "C409",
    "RUF043",
    "UP046",
    "UP047",
    "SIM102",
    "UP040",
    "RUF012",
    "RUF059",
    "C401",
    "C416",
    "RUF001",
    "RUF046",
    "SIM103",
    "SIM108",
    "B905",
    "RUF005",
    "RUF007",
    "UP042",
    "B009",
    "B010",
    "UP012",
]

