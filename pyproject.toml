[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for persistent, workspace-aware AI memory."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.34.0",
    "mcp>=1.0.0",
    "sentence-transformers>=5.1.0",
    "tomlkit>=0.13.0",
    "pyzmq>=27.0.0",
    "textual>=0.44.0",
]

[project.scripts]
mcp-memory = "mcp_memory.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.23",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: fast, isolated tests with no network or model loading",
    "medium: in-process integration tests using real local components",
    "large: end-to-end tests that may start full processes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]
