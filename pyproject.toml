[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for independent AI memory management with hybrid search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-vector-stores-faiss>=0.3.0",
    "faiss-cpu>=1.9.0",
    "watchdog>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "tomlkit>=0.13.0",
    "sentence-transformers>=3.0.0",
    "tenacity>=9.0.0",
    "numpy>=2.0.0",
    "networkx>=3.0.0",
    "pyzmq>=27.1.0",
]

[project.scripts]
mcp-memory = "mcp_memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: fast, isolated tests with no network or model loading",
    "medium: in-process integration tests using real local components",
    "large: end-to-end tests that may start full processes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]
